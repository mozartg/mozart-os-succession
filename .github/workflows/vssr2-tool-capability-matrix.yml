name: VSSR2 Tool Capability Matrix

on:
  push:
    branches:
      - vssr2/tool-capability-test-20260806

permissions:
  contents: read

jobs:
  capability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AUDIT_ROOT: /tmp/vssr2-capability-audit
    steps:
      - name: Checkout disposable test branch
        uses: actions/checkout@v4

      - name: Fetch exact source tags into irrelevant workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$AUDIT_ROOT"
          mkdir -p "$AUDIT_ROOT/logs" "$AUDIT_ROOT/results" "$AUDIT_ROOT/cache"
          git clone --depth 1 --branch v0.8.2 https://github.com/omnigent-ai/omnigent.git "$AUDIT_ROOT/omnigent"
          git clone --depth 1 --branch rust-v0.0.34 https://github.com/openinterpreter/openinterpreter.git "$AUDIT_ROOT/openinterpreter"
          git -C "$AUDIT_ROOT/omnigent" rev-parse HEAD | tee "$AUDIT_ROOT/logs/omnigent_sha.log"
          git -C "$AUDIT_ROOT/openinterpreter" rev-parse HEAD | tee "$AUDIT_ROOT/logs/openinterpreter_sha.log"

      - name: Disposable container read-write-delete canary
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$AUDIT_ROOT:/audit" \
            alpine:3.20 sh -lc '
              set -eu
              mkdir -p /audit/canary/omnigent /audit/canary/openinterpreter
              printf "omnigent-canary\n" > /audit/canary/omnigent/read-write.txt
              printf "openinterpreter-canary\n" > /audit/canary/openinterpreter/read-write.txt
              grep -qx "omnigent-canary" /audit/canary/omnigent/read-write.txt
              grep -qx "openinterpreter-canary" /audit/canary/openinterpreter/read-write.txt
              printf "updated\n" >> /audit/canary/omnigent/read-write.txt
              printf "updated\n" >> /audit/canary/openinterpreter/read-write.txt
              test "$(wc -l < /audit/canary/omnigent/read-write.txt)" -eq 2
              test "$(wc -l < /audit/canary/openinterpreter/read-write.txt)" -eq 2
              rm -f /audit/canary/omnigent/read-write.txt /audit/canary/openinterpreter/read-write.txt
              test ! -e /audit/canary/omnigent/read-write.txt
              test ! -e /audit/canary/openinterpreter/read-write.txt
              echo VSSR_PASS
            ' > "$AUDIT_ROOT/logs/canary_attempt1.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            printf '\nVSSR_FAIL rc=%s\n' "$rc" >> "$AUDIT_ROOT/logs/canary_attempt1.log"
            docker run --rm \
              -v "$AUDIT_ROOT:/audit" \
              python:3.12-alpine sh -lc '
                set -eu
                python -c "from pathlib import Path; p1=Path(\"/audit/canary2/omnigent/read-write.txt\"); p2=Path(\"/audit/canary2/openinterpreter/read-write.txt\"); p1.parent.mkdir(parents=True, exist_ok=True); p2.parent.mkdir(parents=True, exist_ok=True); p1.write_text(\"omnigent-canary\\n\", encoding=\"utf-8\"); p2.write_text(\"openinterpreter-canary\\n\", encoding=\"utf-8\"); assert p1.read_text(encoding=\"utf-8\")==\"omnigent-canary\\n\"; assert p2.read_text(encoding=\"utf-8\")==\"openinterpreter-canary\\n\"; p1.write_text(\"updated\\n\", encoding=\"utf-8\"); p2.write_text(\"updated\\n\", encoding=\"utf-8\"); assert p1.read_text(encoding=\"utf-8\")==\"updated\\n\"; assert p2.read_text(encoding=\"utf-8\")==\"updated\\n\"; p1.unlink(); p2.unlink(); assert not p1.exists(); assert not p2.exists(); print(\"VSSR_PASS\")"
              ' > "$AUDIT_ROOT/logs/canary_attempt2.log" 2>&1
            rc2=$?
            [ "$rc2" -eq 0 ] || printf '\nVSSR_FAIL rc=%s\n' "$rc2" >> "$AUDIT_ROOT/logs/canary_attempt2.log"
          fi
          exit 0

      - name: Omnigent CLI intervention 1 - pip editable install
        id: omni_cli_1
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$AUDIT_ROOT/omnigent:/src:ro" \
            python:3.12-bookworm bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git build-essential >/dev/null
              cp -a /src /tmp/omnigent
              cd /tmp/omnigent
              python -m venv /tmp/venv
              /tmp/venv/bin/pip install -q --upgrade pip setuptools wheel
              /tmp/venv/bin/pip install -q -e ".[dev]"
              /tmp/venv/bin/omnigent --version
              /tmp/venv/bin/omnigent --help >/tmp/omnigent-help.txt
              /tmp/venv/bin/omni diagnose --help >/tmp/omnigent-diagnose-help.txt
              test -s /tmp/omnigent-help.txt
              test -s /tmp/omnigent-diagnose-help.txt
              echo VSSR_PASS
            ' > "$AUDIT_ROOT/logs/omni_cli_attempt1.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || printf '\nVSSR_FAIL rc=%s\n' "$rc" >> "$AUDIT_ROOT/logs/omni_cli_attempt1.log"
          exit "$rc"

      - name: Omnigent CLI intervention 2 - uv lock-aware install
        if: steps.omni_cli_1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$AUDIT_ROOT/omnigent:/src:ro" \
            ghcr.io/astral-sh/uv:python3.12-bookworm-slim bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git build-essential >/dev/null
              cp -a /src /tmp/omnigent
              cd /tmp/omnigent
              uv sync --extra dev
              .venv/bin/omnigent --version
              .venv/bin/omnigent --help >/tmp/omnigent-help.txt
              .venv/bin/omni diagnose --help >/tmp/omnigent-diagnose-help.txt
              test -s /tmp/omnigent-help.txt
              test -s /tmp/omnigent-diagnose-help.txt
              echo VSSR_PASS
            ' > "$AUDIT_ROOT/logs/omni_cli_attempt2.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || printf '\nVSSR_FAIL rc=%s\n' "$rc" >> "$AUDIT_ROOT/logs/omni_cli_attempt2.log"
          exit 0

      - name: Omnigent tests intervention 1 - broad component unit sample
        id: omni_tests_1
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$AUDIT_ROOT/omnigent:/src:ro" \
            ghcr.io/astral-sh/uv:python3.12-bookworm-slim bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git build-essential >/dev/null
              cp -a /src /tmp/omnigent
              cd /tmp/omnigent
              uv sync --extra dev
              mapfile -t files < <(
                find tests -type f -name "test_*.py" \
                  | grep -Ei "(policy|sandbox|scheduled|session|harness|mcp|slack|auth|project|subagent|polly|debby|database|cli)" \
                  | sort | head -n 28
              )
              test "${#files[@]}" -gt 0
              timeout 1200 uv run pytest -q "${files[@]}" \
                -m "not live and not databricks and not nightly" \
                --disable-warnings --maxfail=30
              echo VSSR_PASS
            ' > "$AUDIT_ROOT/logs/omni_tests_attempt1.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || printf '\nVSSR_FAIL rc=%s\n' "$rc" >> "$AUDIT_ROOT/logs/omni_tests_attempt1.log"
          exit "$rc"

      - name: Omnigent tests intervention 2 - focused policy-schedule-sandbox sample
        if: steps.omni_tests_1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$AUDIT_ROOT/omnigent:/src:ro" \
            ghcr.io/astral-sh/uv:python3.12-bookworm-slim bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git build-essential >/dev/null
              cp -a /src /tmp/omnigent
              cd /tmp/omnigent
              uv sync --extra dev
              mapfile -t files < <(
                find tests -type f -name "test_*.py" \
                  | grep -Ei "(policy|scheduled|sandbox)" \
                  | sort | head -n 10
              )
              test "${#files[@]}" -gt 0
              timeout 900 uv run pytest -q "${files[@]}" \
                -m "not live and not databricks and not nightly" \
                --disable-warnings --maxfail=10
              echo VSSR_PASS
            ' > "$AUDIT_ROOT/logs/omni_tests_attempt2.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || printf '\nVSSR_FAIL rc=%s\n' "$rc" >> "$AUDIT_ROOT/logs/omni_tests_attempt2.log"
          exit 0

      - name: Open Interpreter CLI intervention 1 - exact release binary
        id: oi_cli_1
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$AUDIT_ROOT/openinterpreter:/src:ro" \
            ubuntu:24.04 bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl jq tar gzip findutils >/dev/null
              asset="$(
                curl -fsSL https://api.github.com/repos/openinterpreter/openinterpreter/releases/tags/rust-v0.0.34 \
                  | jq -r ".assets[]
                    | select(.name | test(\"open-interpreter-package-x86_64-unknown-linux-(gnu|musl)\\\\.tar\\\\.gz$\"))
                    | .browser_download_url" | head -n 1
              )"
              test -n "$asset"
              mkdir -p /tmp/oi
              curl -fsSL "$asset" -o /tmp/oi.tar.gz
              tar -xzf /tmp/oi.tar.gz -C /tmp/oi
              bin="$(find /tmp/oi -type f -name interpreter -perm -111 | head -n 1)"
              test -x "$bin"
              "$bin" --version
              "$bin" --help >/tmp/oi-help.txt
              "$bin" exec --help >/tmp/oi-exec-help.txt
              "$bin" acp --help >/tmp/oi-acp-help.txt
              "$bin" mcp-server --help >/tmp/oi-mcp-help.txt
              test -s /tmp/oi-help.txt
              test -s /tmp/oi-exec-help.txt
              test -s /tmp/oi-acp-help.txt
              test -s /tmp/oi-mcp-help.txt
              echo VSSR_PASS
            ' > "$AUDIT_ROOT/logs/oi_cli_attempt1.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || printf '\nVSSR_FAIL rc=%s\n' "$rc" >> "$AUDIT_ROOT/logs/oi_cli_attempt1.log"
          exit "$rc"

      - name: Open Interpreter CLI intervention 2 - source build
        if: steps.oi_cli_1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$AUDIT_ROOT/openinterpreter:/src:ro" \
            -v "$AUDIT_ROOT/cache/cargo:/cargo" \
            rust:1-bookworm bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git pkg-config libssl-dev clang cmake >/dev/null
              cp -a /src /tmp/openinterpreter
              cd /tmp/openinterpreter
              export CARGO_HOME=/cargo/home
              export CARGO_TARGET_DIR=/cargo/target
              timeout 1800 cargo build --release --bin interpreter
              bin="$CARGO_TARGET_DIR/release/interpreter"
              "$bin" --version
              "$bin" --help >/tmp/oi-help.txt
              "$bin" exec --help >/tmp/oi-exec-help.txt
              test -s /tmp/oi-help.txt
              test -s /tmp/oi-exec-help.txt
              echo VSSR_PASS
            ' > "$AUDIT_ROOT/logs/oi_cli_attempt2.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || printf '\nVSSR_FAIL rc=%s\n' "$rc" >> "$AUDIT_ROOT/logs/oi_cli_attempt2.log"
          exit 0

      - name: Open Interpreter tests intervention 1 - codex-core unit suite
        id: oi_tests_1
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$AUDIT_ROOT/openinterpreter:/src:ro" \
            -v "$AUDIT_ROOT/cache/cargo:/cargo" \
            rust:1-bookworm bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git pkg-config libssl-dev clang cmake >/dev/null
              cp -a /src /tmp/openinterpreter
              cd /tmp/openinterpreter
              export CARGO_HOME=/cargo/home
              export CARGO_TARGET_DIR=/cargo/target
              cargo metadata --no-deps --format-version 1 | grep -q "\"name\":\"codex-core\""
              timeout 1800 cargo test -p codex-core --lib --no-fail-fast
              echo VSSR_PASS
            ' > "$AUDIT_ROOT/logs/oi_tests_attempt1.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || printf '\nVSSR_FAIL rc=%s\n' "$rc" >> "$AUDIT_ROOT/logs/oi_tests_attempt1.log"
          exit "$rc"

      - name: Open Interpreter tests intervention 2 - protocol or MCP unit suite
        if: steps.oi_tests_1.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$AUDIT_ROOT/openinterpreter:/src:ro" \
            -v "$AUDIT_ROOT/cache/cargo:/cargo" \
            rust:1-bookworm bash -lc '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git pkg-config libssl-dev clang cmake jq >/dev/null
              cp -a /src /tmp/openinterpreter
              cd /tmp/openinterpreter
              export CARGO_HOME=/cargo/home
              export CARGO_TARGET_DIR=/cargo/target
              pkg="$(
                cargo metadata --no-deps --format-version 1 \
                  | jq -r ".packages[].name" \
                  | grep -E "^(codex-protocol|codex-mcp-server|codex-app-server-protocol)$" \
                  | head -n 1
              )"
              test -n "$pkg"
              timeout 1200 cargo test -p "$pkg" --lib --no-fail-fast
              echo VSSR_PASS
            ' > "$AUDIT_ROOT/logs/oi_tests_attempt2.log" 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || printf '\nVSSR_FAIL rc=%s\n' "$rc" >> "$AUDIT_ROOT/logs/oi_tests_attempt2.log"
          exit 0

      - name: Build every-entry matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vssr2_tool_capability_audit.py \
            --root "$AUDIT_ROOT" \
            --out "$AUDIT_ROOT/results"
          cp "$AUDIT_ROOT/logs/"*.log "$AUDIT_ROOT/results/" || true
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner=${RUNNER_NAME}"
            echo "repository=${GITHUB_REPOSITORY}"
          } > "$AUDIT_ROOT/results/execution-receipt.txt"

      - name: Upload VSSR 2.0 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vssr2-tool-capability-matrix
          path: /tmp/vssr2-capability-audit/results
          if-no-files-found: error
          retention-days: 7
