name: Verify reusable micro-test v2 once

on:
  push:
    branches:
      - fix/reusable-micro-test-v2-20260806
    paths:
      - .github/workflows/verify-reusable-micro-test-v2-once.yml

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify actionlint release checksum and lint changed workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/actionlint-install
          curl --fail --silent --show-error --location \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          curl --fail --silent --show-error --location \
            --output /tmp/actionlint-checksums.txt \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt
          grep 'actionlint_1.7.7_linux_amd64.tar.gz$' /tmp/actionlint-checksums.txt \
            | sed 's#  actionlint_1.7.7_linux_amd64.tar.gz#  /tmp/actionlint.tar.gz#' \
            | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint-install actionlint
          /tmp/actionlint-install/actionlint \
            .github/workflows/reusable-micro-test.yml \
            .github/workflows/verify-reusable-micro-test-v2-once.yml

      - name: Verify exact official action pins and evidence gates
        shell: python
        run: |
          from pathlib import Path

          text = Path('.github/workflows/reusable-micro-test.yml').read_text(encoding='utf-8')
          required = {
              'checkout v7.0.1': 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1',
              'setup-node v7.0.0': 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020',
              'setup-python v7.0.0': 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97',
              'upload-artifact v7.0.1': 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a',
              'Node 24 default': "default: '24'",
              'structure report': 'repository-structure-report.json',
              'workflow report': 'actionlint-report.txt',
              'complete contract report': 'repository-contract-report.json',
              'hidden evidence upload': 'include-hidden-files: true',
              'missing evidence is terminal': 'if-no-files-found: error',
              'non-mutating unlocked npm install': 'npm install --package-lock=false',
          }
          missing = [name for name, value in required.items() if value not in text]
          if missing:
              raise SystemExit(f'reusable micro-test contract missing: {missing}')
          print('Reusable micro-test v2 static contract passed.')

  exercise-default-contract:
    uses: ./.github/workflows/reusable-micro-test.yml
    with:
      node_version: '24'
      python_version: '3.12'
      enforce_actionlint: false
      strict_landing: false
