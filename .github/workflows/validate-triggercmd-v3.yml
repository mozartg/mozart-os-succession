name: Validate TRIGGERcmd v3 control plane

on:
  pull_request:
    branches: [main]
    paths:
      - 'triggercmd/v3/**'
      - '.github/workflows/validate-triggercmd-v3.yml'
  push:
    branches: [main]
    paths:
      - 'triggercmd/v3/**'
      - '.github/workflows/validate-triggercmd-v3.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate hashes, syntax, provider routes, and one-time action
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'triggercmd/v3'
          $manifest = Get-Content (Join-Path $root 'manifest.json') -Raw | ConvertFrom-Json
          $mapping = @{
            'bootstrap.ps1' = 'bootstrap.ps1'
            'Control\fleet.ps1' = 'fleet.ps1'
            'Control\worker.ps1' = 'worker.ps1'
            'Control\tasks.psm1' = 'tasks.psm1'
            'Control\catdesk-autostart.ps1' = 'catdesk-autostart.ps1'
            'Control\catdesk-console-input.ps1' = 'catdesk-console-input.ps1'
            'Control\media-factory-repository-create.ps1' = 'media-factory-repository-create.ps1'
          }
          foreach ($file in $manifest.files) {
            $sourceName = $mapping[[string]$file.target]
            if ([string]::IsNullOrWhiteSpace($sourceName)) { throw "Unmapped managed target: $($file.target)" }
            $path = Join-Path $root $sourceName
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing source file: $path" }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne ([string]$file.sha256).ToLowerInvariant()) {
              throw "Raw-byte hash mismatch: $($file.target) expected=$($file.sha256) actual=$actual"
            }
          }
          foreach ($path in @('bootstrap.ps1','fleet.ps1','worker.ps1','tasks.psm1','catdesk-autostart.ps1','catdesk-console-input.ps1','media-factory-repository-create.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $root $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$path syntax: $($errors[0].Message)" }
          }
          $command = @($manifest.commands | Where-Object trigger -eq 'media_factory_bootstrap')
          if ($command.Count -ne 1 -or [string]$command[0].task -ne 'media_factory_bootstrap') { throw 'Media Factory command registration invalid.' }
          $actions = @($manifest.oneTimeActions | Where-Object id -eq 'media-factory-bootstrap-provider-routes-20260801')
          if ($actions.Count -ne 1 -or [string]$actions[0].task -ne 'media_factory_bootstrap') { throw 'Provider-route one-time action invalid.' }
          $bootstrap = Get-Content (Join-Path $root 'bootstrap.ps1') -Raw
          $fleet = Get-Content (Join-Path $root 'fleet.ps1') -Raw
          $tasks = Get-Content (Join-Path $root 'tasks.psm1') -Raw
          $provider = Get-Content (Join-Path $root 'media-factory-repository-create.ps1') -Raw
          if ($bootstrap -notmatch 'Invoke-OneTimeActions') { throw 'Bootstrap one-time action executor missing.' }
          if ($tasks -notmatch 'media-factory-repository-create.ps1') { throw 'Task delegate is not bound to the provider script.' }
          if ($provider -notmatch 'official_rest_authenticated_user') { throw 'Official REST route receipt is missing.' }
          if ($provider -notmatch 'gh_cli_authenticated_user_default_owner') { throw 'GitHub CLI fallback receipt is missing.' }
          if ($provider -notmatch 'credential_disclosed = \$false') { throw 'Credential-disclosure boundary is missing.' }
          if ($fleet -notmatch 'media_factory_bootstrap') { throw 'Fleet task missing.' }
          Write-Host "Validated Control Plane $($manifest.version) with staged provider routes and receipt controls."

      - name: Verify published raw URLs after main updates
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content 'triggercmd/v3/manifest.json' -Raw | ConvertFrom-Json
          $temp = Join-Path $env:RUNNER_TEMP 'published'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          foreach ($file in $manifest.files) {
            $name = ([string]$file.target -replace '[\\/]','-')
            $path = Join-Path $temp $name
            Invoke-WebRequest -Uri (([string]$file.url) + '?verify=' + $env:GITHUB_SHA) -OutFile $path -UseBasicParsing
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne ([string]$file.sha256).ToLowerInvariant()) {
              throw "Published URL hash mismatch: $($file.target) expected=$($file.sha256) actual=$actual"
            }
          }
          Write-Host 'Published raw GitHub URLs match the deployment manifest.'
